  npm / PyPI / RubyGems / Packagist registry searches that returned no first-party Thanx client.
description: >-
  Thanx publishes no client library on any public package registry. Its two first-party SDKs
  were mobile-only and are both DEPRECATED and archived: the iOS SDK was distributed as a
  CocoaPod through the company's own private spec repo (never pushed to CocoaPods trunk — the
  trunk API returns 404 for ThanxSDK), and the Android SDK as .aar binaries committed to a
  distribution repo. Both stopped shipping in 2021, four years before the v4.0 API surface and
  the Partner/Promotions endpoints documented today, so nothing here wraps the current API.
  Integrators are expected to call the REST APIs directly and start from the Postman
  collections (see collections/ and https://docs.thanx.com/overview/api_collections).
