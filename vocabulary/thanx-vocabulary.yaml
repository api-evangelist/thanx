vocabulary: 1.0.0
info:
  provider: Thanx
  description: Unified taxonomy mapping the operational (OpenAPI) and capability (Naftiko) dimensions of the Thanx Consumer, Partner, and Loyalty APIs.
  created: '2026-06-03'
  modified: '2026-06-03'
operational:
  apis:
  - name: Thanx Consumer API
    namespace: consumer-api
    version: v4.0
    baseUrl: https://api.thanx.com
    status: active
  - name: Thanx Loyalty API
    namespace: loyalty-api
    version: v1
    baseUrl: https://loyalty.thanx.com
    status: active
  - name: Thanx Partner API
    namespace: partner-api
    version: v4.0
    baseUrl: https://api.thanx.com
    status: active
  resources:
  - name: users
    api: Thanx Consumer API
    actions:
    - create
    - get
  - name: cards
    api: Thanx Consumer API
    actions:
    - create
    - delete
    - get
  - name: rewards
    api: Thanx Consumer API
    actions:
    - create
    - get
  - name: purchases
    api: Thanx Consumer API
    actions:
    - create
    - get
  - name: points
    api: Thanx Consumer API
    actions:
    - get
  - name: locations
    api: Thanx Consumer API
    actions:
    - get
  - name: gift-cards
    api: Thanx Consumer API
    actions:
    - create
    - get
  - name: account
    api: Thanx Loyalty API
    actions:
    - get
  - name: baskets
    api: Thanx Loyalty API
    actions:
    - create
  - name: auth
    api: Thanx Partner API
    actions:
    - create
  - name: campaigns
    api: Thanx Partner API
    actions:
    - create
    - get
  - name: issuance-jobs
    api: Thanx Partner API
    actions:
    - create
    - get
  - name: subscribers
    api: Thanx Partner API
    actions:
    - create
  - name: metadata
    api: Thanx Partner API
    actions:
    - get
  actions:
  - name: get
    methods:
    - GET
    pattern: read
  - name: create
    methods:
    - POST
    pattern: write
  - name: delete
    methods:
    - DELETE
    pattern: destructive
  schemas:
    core:
    - name: UserEnvelope
      api: Thanx Consumer API
      properties:
      - user
    - name: User
      api: Thanx Consumer API
      properties:
      - id
      - email
      - phone
      - first_name
      - last_name
      - birth_date
      - zip_code
    - name: UserInput
      api: Thanx Consumer API
      properties:
      - email
      - phone
      - first_name
      - last_name
      - birth_date
      - zip_code
      - signup_program_id
    - name: BirthDate
      api: Thanx Consumer API
      properties:
      - year
      - month
      - day
    - name: Authorization
      api: Thanx Consumer API
      properties:
      - token_type
      - scope
      - created_at
      - access_token
      - refresh_token
    - name: Location
      api: Thanx Consumer API
      properties:
      - id
      - merchant_id
      - street
      - city
      - state
      - zip
      - name
      - phone
    - name: Pagination
      api: Thanx Consumer API
      properties:
      - total_page
      - per_page
      - current_page
    - name: Account
      api: Thanx Loyalty API
      properties:
      - id
      - email
      - rewards
      - points_products
      - points_balances
    - name: PartnerUser
      api: Thanx Partner API
      properties:
      - id
      - email
      - phone
      - first_name
      - last_name
    commerce:
    - name: CardEnvelope
      api: Thanx Consumer API
      properties:
      - card
    - name: Card
      api: Thanx Consumer API
      properties:
      - id
      - user_id
      - last4
      - type
      - zip_code
    - name: Purchase
      api: Thanx Consumer API
      properties:
      - id
      - user_id
      - merchant_id
      - location_id
      - purchased_at
      - amount
      - order
    - name: GiftCard
      api: Thanx Consumer API
      properties:
      - id
      - user_id
      - balance
      - code
    - name: BasketInput
      api: Thanx Loyalty API
      properties:
      - id
      - state
      - order_timestamp
      - location_uid
      - rewards
      - points_products
      - payments
      - items
    - name: BasketItem
      api: Thanx Loyalty API
      properties:
      - id
      - name
      - price
      - categories
      - modifiers
    - name: Payment
      api: Thanx Loyalty API
      properties:
      - issuer
      - last4
      - amount
      - authorized_at
    - name: Basket
      api: Thanx Loyalty API
      properties:
      - id
      - state
      - discount
    loyalty:
    - name: RewardEnvelope
      api: Thanx Consumer API
      properties:
      - reward
    - name: Reward
      api: Thanx Consumer API
      properties:
      - id
      - olo_uid
      - user_id
      - merchant_id
      - campaign_id
      - state
      - earn
      - redeem
    - name: LoyaltyReward
      api: Thanx Loyalty API
      properties:
      - id
      - value
      - label
      - state
      - type
    - name: PointsProduct
      api: Thanx Loyalty API
      properties:
      - id
      - label
      - cost
    marketing:
    - name: CampaignInput
      api: Thanx Partner API
      properties:
      - merchant_id
      - name
      - objective
      - fine_print
      - start_at
      - end_at
      - redeemable_from
      - redeemable_to
    - name: CampaignVariantInput
      api: Thanx Partner API
      properties:
      - name
      - reward_template_id
    - name: Campaign
      api: Thanx Partner API
      properties:
      - id
      - name
      - objective
      - start_at
      - end_at
      - redeemable_from
      - redeemable_to
      - time_zone
    - name: IssuanceJob
      api: Thanx Partner API
      properties:
      - id
      - state
      - requested_count
      - issued_count
      - failed_count
      - created_at
      - updated_at
  parameters:
    filters:
    - redemption_venue
    - reward_states[]
    - states[]
    identifiers:
    - location_id
    - merchant_id
    - user_id
  enums:
    states:
    - active
    - available
    - billed
    - checkout
    - delivered
    - open
    - redeemable
    - used
    - validated
    types:
    - amount
    - direct
    - indirect
    - item
    - none
    - percent
  authentication:
  - api: Thanx Consumer API
    schemes:
    - bearerAuth
    - clientId
  - api: Thanx Loyalty API
    schemes:
    - bearerAuth
    - merchantKey
  - api: Thanx Partner API
    schemes:
    - bearerAuth
    - clientId
