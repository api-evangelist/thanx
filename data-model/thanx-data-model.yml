projections:
  note: >-
    User (Consumer), PartnerUser (Partner) and Account (Loyalty) are three projections of the
    same person across three API families. Reward and LoyaltyReward are likewise two
    projections of one reward. An integration touching more than one family must reconcile them
    on id.
