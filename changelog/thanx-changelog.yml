    breaking: false
    additions:
      - 'memberships.alternate_pos_id — alternate user identifier sent to certain in-store POS systems when loyalty is applied at the register; currently only the Toast POS integration, where it matches APPLIED_LOYALTY_ID on Toast POS reports.'
    highlights: [Toast POS identifier exposed in the memberships export]
  - date: '2025-06-01'
    breaking: false
    additions:
      - 'rewards.redemption_pos_order_id — POS ID of the order the reward was redeemed against (merchants with in-store POS integrations).'
      - 'rewards.redemption_pos_provider — POS provider for the integrated in-store redemption.'
      - 'purchases.pos_id — POS ID of the order, set for brands using POS check-in loyalty.'
      - 'purchases.pos_provider — POS provider of the order, present only for in-store check-in purchases.'
    improvements:
      - 'rewards.discount — more accurate discount amounts for integrated redemption.'
    highlights: [In-store POS redemption attribution added to the rewards and purchases exports]
