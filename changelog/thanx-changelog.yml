generated: '2026-08-13'
method: searched
source: https://docs.thanx.com/data/changelog
description: >-
  Thanx runs TWO change surfaces and neither is an API changelog. docs.thanx.com/data/changelog
  is a dated changelog scoped to DATA EXPORT SCHEMA changes, and it carries the platform's only
  written compatibility contract (additive-only columns, retired columns emptied rather than
  dropped). thanx.launchnotes.io is a product-release feed for the merchant-facing product,
  organized by category and subscribable, with a public roadmap section. The REST APIs
  themselves have no dated changelog: version changes are announced to partners directly and
  the client pins with Accept-Version: v4.0.
surfaces:
  - name: Data export changelog
    url: https://docs.thanx.com/data/changelog
    scope: SFTP / Connex export schema
    dated: true
    machine_readable: false
    subscribable: false
  - name: Thanx Product Updates (LaunchNotes)
    url: https://thanx.launchnotes.io/
    scope: merchant-facing product releases
    dated: true
    subscribable: true
    categories: [Integrations, Ordering, Loyalty, Guest Engagement, Marketing Automation, Toast, ThanxAI, Offers & Rewards, Reporting & Insights, Org Management & Settings, App Experience]
    roadmap: true
  - name: Releases listing
    url: https://www.thanx.com/releases-listing
    scope: marketing-site summary of product releases
  - name: REST API changelog
    url: null
    scope: Consumer / Partner / Loyalty APIs
    exists: false
    note: >-
      No dated API changelog is published. "Thanx will notify you when a new API version is
      available" (https://docs.thanx.com/consumer/usage/headers).
versioning:
  scheme: explicit version token per API family
  consumer_partner: {header: Accept-Version, current: v4.0}
  loyalty: {header: Accept, current: application/vnd.thanx-v1+json}
  detail: lifecycle/thanx-lifecycle.yml
compatibility_policy:
  name: Schema management policy
  url: https://docs.thanx.com/data/changelog
  scope: data exports
  rules:
    - Attributes are ADDED as new columns on the right; consumers must parse by header name and ignore unknown columns.
    - Attributes are NOT removed; a retired column stays in the schema and is emptied.
    - Data types are NOT changed; calculation changes are announced with an effective date.
  enforcement: >-
    Stated as a requirement on consumers — "All consumers of Thanx SFTP exports are required to
    build their integrations to comply with the rules below."
