naftiko: 1.0.0-alpha2
info:
  label: "Thanx Consumer API \u2014 Cards"
  description: 'Cards surface of the Thanx Consumer API. 3 operations. Lead operation: Create Card. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Consumer
  - Cards
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: consumer-api-cards
    baseUri: https://api.thanx.com
    description: "Thanx Consumer API \u2014 Cards business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: cards
      path: /cards
      operations:
      - name: createCard
        method: POST
        description: Create Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create Card request body.
      - name: getCards
        method: GET
        description: Get Cards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cards-id
      path: /cards/{id}
      operations:
      - name: deleteCard
        method: DELETE
        description: Delete Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: consumer-api-cards-rest
    port: 8080
    description: "REST adapter for Thanx Consumer API \u2014 Cards. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/cards
      name: cards
      description: REST surface for cards.
      operations:
      - method: POST
        name: createCard
        description: Create Card
        call: consumer-api-cards.createCard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getCards
        description: Get Cards
        call: consumer-api-cards.getCards
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cards/{id}
      name: cards
      description: REST surface for cards.
      operations:
      - method: DELETE
        name: deleteCard
        description: Delete Card
        call: consumer-api-cards.deleteCard
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: consumer-api-cards-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Consumer API \u2014 Cards. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: create-card
      description: Create Card
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: consumer-api-cards.createCard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cards
      description: Get Cards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: consumer-api-cards.getCards
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-card
      description: Delete Card
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: consumer-api-cards.deleteCard
      with: {}
      outputParameters:
      - type: object
        mapping: $.
