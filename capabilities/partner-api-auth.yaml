naftiko: 1.0.0-alpha2
info:
  label: "Thanx Partner API \u2014 Auth"
  description: 'Auth surface of the Thanx Partner API. 1 operations. Lead operation: Create Access Token. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Partner
  - Auth
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: partner-api-auth
    baseUri: https://api.thanx.com
    description: "Thanx Partner API \u2014 Auth business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: partner-oauth-token
      path: /partner/oauth/token
      operations:
      - name: createToken
        method: POST
        description: Create Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create Access Token request body.
  exposes:
  - type: rest
    namespace: partner-api-auth-rest
    port: 8080
    description: "REST adapter for Thanx Partner API \u2014 Auth. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/oauth/token
      name: partner-oauth-token
      description: REST surface for partner-oauth-token.
      operations:
      - method: POST
        name: createToken
        description: Create Access Token
        call: partner-api-auth.createToken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: partner-api-auth-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Partner API \u2014 Auth. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: create-access-token
      description: Create Access Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: partner-api-auth.createToken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
