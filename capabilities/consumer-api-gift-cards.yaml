naftiko: 1.0.0-alpha2
info:
  label: "Thanx Consumer API \u2014 Gift Cards"
  description: 'Gift Cards surface of the Thanx Consumer API. 2 operations. Lead operation: Get Gift Cards. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Consumer
  - Gift Cards
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: consumer-api-gift-cards
    baseUri: https://api.thanx.com
    description: "Thanx Consumer API \u2014 Gift Cards business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: gift-cards
      path: /gift_cards
      operations:
      - name: getGiftCards
        method: GET
        description: Get Gift Cards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createGiftCard
        method: POST
        description: Create Gift Card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create Gift Card request body.
  exposes:
  - type: rest
    namespace: consumer-api-gift-cards-rest
    port: 8080
    description: "REST adapter for Thanx Consumer API \u2014 Gift Cards. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/gift_cards
      name: gift-cards
      description: REST surface for gift-cards.
      operations:
      - method: GET
        name: getGiftCards
        description: Get Gift Cards
        call: consumer-api-gift-cards.getGiftCards
        with: {}
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createGiftCard
        description: Create Gift Card
        call: consumer-api-gift-cards.createGiftCard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: consumer-api-gift-cards-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Consumer API \u2014 Gift Cards. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-gift-cards
      description: Get Gift Cards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: consumer-api-gift-cards.getGiftCards
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: create-gift-card
      description: Create Gift Card
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: consumer-api-gift-cards.createGiftCard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
