naftiko: 1.0.0-alpha2
info:
  label: "Thanx Partner API \u2014 Users"
  description: 'Users surface of the Thanx Partner API. 2 operations. Lead operation: Get User. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Partner
  - Users
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: partner-api-users
    baseUri: https://api.thanx.com
    description: "Thanx Partner API \u2014 Users business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: partner-users-id
      path: /partner/users/{id}
      operations:
      - name: getPartnerUser
        method: GET
        description: Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: partner-users
      path: /partner/users
      operations:
      - name: getPartnerUsers
        method: GET
        description: Get Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: merchant_id
          in: query
          type: string
          required: false
          description: merchant_id
  exposes:
  - type: rest
    namespace: partner-api-users-rest
    port: 8080
    description: "REST adapter for Thanx Partner API \u2014 Users. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/users/{id}
      name: partner-users
      description: REST surface for partner-users.
      operations:
      - method: GET
        name: getPartnerUser
        description: Get User
        call: partner-api-users.getPartnerUser
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: partner-users
      description: REST surface for partner-users.
      operations:
      - method: GET
        name: getPartnerUsers
        description: Get Users
        call: partner-api-users.getPartnerUsers
        with:
          merchant_id: rest.merchant_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: partner-api-users-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Partner API \u2014 Users. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-user
      description: Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: partner-api-users.getPartnerUser
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: get-users
      description: Get Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: partner-api-users.getPartnerUsers
      with:
        merchant_id: tools.merchant_id
      outputParameters:
      - type: object
        mapping: $.
