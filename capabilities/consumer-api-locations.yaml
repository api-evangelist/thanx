naftiko: 1.0.0-alpha2
info:
  label: "Thanx Consumer API \u2014 Locations"
  description: 'Locations surface of the Thanx Consumer API. 1 operations. Lead operation: Get Locations. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Consumer
  - Locations
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: consumer-api-locations
    baseUri: https://api.thanx.com
    description: "Thanx Consumer API \u2014 Locations business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: locations
      path: /locations
      operations:
      - name: getLocations
        method: GET
        description: Get Locations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: merchant_id
          in: query
          type: string
          required: false
          description: merchant_id
  exposes:
  - type: rest
    namespace: consumer-api-locations-rest
    port: 8080
    description: "REST adapter for Thanx Consumer API \u2014 Locations. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/locations
      name: locations
      description: REST surface for locations.
      operations:
      - method: GET
        name: getLocations
        description: Get Locations
        call: consumer-api-locations.getLocations
        with:
          merchant_id: rest.merchant_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: consumer-api-locations-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Consumer API \u2014 Locations. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-locations
      description: Get Locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: consumer-api-locations.getLocations
      with:
        merchant_id: tools.merchant_id
      outputParameters:
      - type: object
        mapping: $.
