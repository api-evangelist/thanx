naftiko: 1.0.0-alpha2
info:
  label: "Thanx Partner API \u2014 Subscribers"
  description: 'Subscribers surface of the Thanx Partner API. 1 operations. Lead operation: Create Subscriber. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Partner
  - Subscribers
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: partner-api-subscribers
    baseUri: https://api.thanx.com
    description: "Thanx Partner API \u2014 Subscribers business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: partner-subscribers
      path: /partner/subscribers
      operations:
      - name: createSubscriber
        method: POST
        description: Create Subscriber
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create Subscriber request body.
  exposes:
  - type: rest
    namespace: partner-api-subscribers-rest
    port: 8080
    description: "REST adapter for Thanx Partner API \u2014 Subscribers. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/subscribers
      name: partner-subscribers
      description: REST surface for partner-subscribers.
      operations:
      - method: POST
        name: createSubscriber
        description: Create Subscriber
        call: partner-api-subscribers.createSubscriber
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: partner-api-subscribers-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Partner API \u2014 Subscribers. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: create-subscriber
      description: Create Subscriber
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: partner-api-subscribers.createSubscriber
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
