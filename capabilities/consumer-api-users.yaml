naftiko: 1.0.0-alpha2
info:
  label: "Thanx Consumer API \u2014 Users"
  description: 'Users surface of the Thanx Consumer API. 2 operations. Lead operation: Get User. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Consumer
  - Users
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: consumer-api-users
    baseUri: https://api.thanx.com
    description: "Thanx Consumer API \u2014 Users business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: users-me
      path: /users/me
      operations:
      - name: getUser
        method: GET
        description: Get User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users
      operations:
      - name: createUser
        method: POST
        description: Create User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create User request body.
  exposes:
  - type: rest
    namespace: consumer-api-users-rest
    port: 8080
    description: "REST adapter for Thanx Consumer API \u2014 Users. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/users/me
      name: users-me
      description: REST surface for users-me.
      operations:
      - method: GET
        name: getUser
        description: Get User
        call: consumer-api-users.getUser
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: POST
        name: createUser
        description: Create User
        call: consumer-api-users.createUser
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: consumer-api-users-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Consumer API \u2014 Users. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-user
      description: Get User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: consumer-api-users.getUser
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: consumer-api-users.createUser
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
