naftiko: 1.0.0-alpha2
info:
  label: "Thanx Loyalty API \u2014 Account"
  description: 'Account surface of the Thanx Loyalty API. 1 operations. Lead operation: Get Account. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Loyalty
  - Account
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: loyalty-api-account
    baseUri: https://loyalty.thanx.com
    description: "Thanx Loyalty API \u2014 Account business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: api-account
      path: /api/account
      operations:
      - name: getAccount
        method: GET
        description: Get Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: location_id
          in: query
          type: string
          required: false
          description: Thanx Location UID.
        - name: redemption_venue
          in: query
          type: string
          required: false
          description: Venue where the redemption occurs.
        - name: reward_states[]
          in: query
          type: array
          required: false
          description: Filter rewards by state.
  exposes:
  - type: rest
    namespace: loyalty-api-account-rest
    port: 8080
    description: "REST adapter for Thanx Loyalty API \u2014 Account. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/account
      name: api-account
      description: REST surface for api-account.
      operations:
      - method: GET
        name: getAccount
        description: Get Account
        call: loyalty-api-account.getAccount
        with:
          location_id: rest.location_id
          redemption_venue: rest.redemption_venue
          reward_states[]: rest.reward_states[]
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: loyalty-api-account-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Loyalty API \u2014 Account. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-account
      description: Get Account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: loyalty-api-account.getAccount
      with:
        location_id: tools.location_id
        redemption_venue: tools.redemption_venue
        reward_states[]: tools.reward_states[]
      outputParameters:
      - type: object
        mapping: $.
