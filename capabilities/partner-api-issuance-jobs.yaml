naftiko: 1.0.0-alpha2
info:
  label: "Thanx Partner API \u2014 Issuance Jobs"
  description: 'Issuance Jobs surface of the Thanx Partner API. 2 operations. Lead operation: Get Issuance Job. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Partner
  - Issuance Jobs
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: partner-api-issuance-jobs
    baseUri: https://api.thanx.com
    description: "Thanx Partner API \u2014 Issuance Jobs business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: partner-issuance-jobs-id
      path: /partner/issuance_jobs/{id}
      operations:
      - name: getIssuanceJob
        method: GET
        description: Get Issuance Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: partner-issuance-jobs-id-revoke
      path: /partner/issuance_jobs/{id}/revoke
      operations:
      - name: revokeIssuanceJob
        method: POST
        description: Revoke Issuance Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: partner-api-issuance-jobs-rest
    port: 8080
    description: "REST adapter for Thanx Partner API \u2014 Issuance Jobs. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/issuance_jobs/{id}
      name: partner-issuance-jobs
      description: REST surface for partner-issuance-jobs.
      operations:
      - method: GET
        name: getIssuanceJob
        description: Get Issuance Job
        call: partner-api-issuance-jobs.getIssuanceJob
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/issuance_jobs/{id}/revoke
      name: partner-issuance-jobs-revoke
      description: REST surface for partner-issuance-jobs-revoke.
      operations:
      - method: POST
        name: revokeIssuanceJob
        description: Revoke Issuance Job
        call: partner-api-issuance-jobs.revokeIssuanceJob
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: partner-api-issuance-jobs-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Partner API \u2014 Issuance Jobs. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-issuance-job
      description: Get Issuance Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: partner-api-issuance-jobs.getIssuanceJob
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: revoke-issuance-job
      description: Revoke Issuance Job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: partner-api-issuance-jobs.revokeIssuanceJob
      with: {}
      outputParameters:
      - type: object
        mapping: $.
