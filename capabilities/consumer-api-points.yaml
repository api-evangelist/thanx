naftiko: 1.0.0-alpha2
info:
  label: "Thanx Consumer API \u2014 Points"
  description: 'Points surface of the Thanx Consumer API. 1 operations. Lead operation: Get Points Balance. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Consumer
  - Points
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: consumer-api-points
    baseUri: https://api.thanx.com
    description: "Thanx Consumer API \u2014 Points business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: points-experiences-id-balance
      path: /points_experiences/{id}/balance
      operations:
      - name: getPointsBalance
        method: GET
        description: Get Points Balance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: consumer-api-points-rest
    port: 8080
    description: "REST adapter for Thanx Consumer API \u2014 Points. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/points_experiences/{id}/balance
      name: points-experiences-balance
      description: REST surface for points-experiences-balance.
      operations:
      - method: GET
        name: getPointsBalance
        description: Get Points Balance
        call: consumer-api-points.getPointsBalance
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: consumer-api-points-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Consumer API \u2014 Points. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: get-points-balance
      description: Get Points Balance
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: consumer-api-points.getPointsBalance
      with: {}
      outputParameters:
      - type: object
        mapping: $.
