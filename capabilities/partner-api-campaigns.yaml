naftiko: 1.0.0-alpha2
info:
  label: "Thanx Partner API \u2014 Campaigns"
  description: 'Campaigns surface of the Thanx Partner API. 4 operations. Lead operation: Create Campaign. Self-contained Naftiko capability covering one Thanx business surface.'
  tags:
  - Thanx
  - Partner
  - Campaigns
  created: '2026-06-03'
  modified: '2026-06-03'
binds:
- namespace: env
  keys:
    THANX_ACCESS_TOKEN: THANX_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: partner-api-campaigns
    baseUri: https://api.thanx.com
    description: "Thanx Partner API \u2014 Campaigns business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.THANX_ACCESS_TOKEN}}'
    resources:
    - name: partner-campaigns
      path: /partner/campaigns
      operations:
      - name: createCampaign
        method: POST
        description: Create Campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Create Campaign request body.
      - name: listCampaigns
        method: GET
        description: List Campaigns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: merchant_id
          in: query
          type: string
          required: false
          description: merchant_id
    - name: partner-campaigns-id
      path: /partner/campaigns/{id}
      operations:
      - name: getCampaign
        method: GET
        description: Get Campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: partner-campaigns-issue
      path: /partner/campaigns/issue
      operations:
      - name: issueRewards
        method: POST
        description: Issue Rewards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
          description: Issue Rewards request body.
  exposes:
  - type: rest
    namespace: partner-api-campaigns-rest
    port: 8080
    description: "REST adapter for Thanx Partner API \u2014 Campaigns. One Spectral-compliant resource per consumed operation, prefixed with /v1."
    resources:
    - path: /v1/campaigns
      name: partner-campaigns
      description: REST surface for partner-campaigns.
      operations:
      - method: POST
        name: createCampaign
        description: Create Campaign
        call: partner-api-campaigns.createCampaign
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listCampaigns
        description: List Campaigns
        call: partner-api-campaigns.listCampaigns
        with:
          merchant_id: rest.merchant_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/campaigns/{id}
      name: partner-campaigns
      description: REST surface for partner-campaigns.
      operations:
      - method: GET
        name: getCampaign
        description: Get Campaign
        call: partner-api-campaigns.getCampaign
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/campaigns/issue
      name: partner-campaigns-issue
      description: REST surface for partner-campaigns-issue.
      operations:
      - method: POST
        name: issueRewards
        description: Issue Rewards
        call: partner-api-campaigns.issueRewards
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: partner-api-campaigns-mcp
    port: 9090
    transport: http
    description: "MCP adapter for Thanx Partner API \u2014 Campaigns. One tool per consumed operation, routed inline through this capability's consumes block."
    tools:
    - name: create-campaign
      description: Create Campaign
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: partner-api-campaigns.createCampaign
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-campaigns
      description: List Campaigns
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: partner-api-campaigns.listCampaigns
      with:
        merchant_id: tools.merchant_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-campaign
      description: Get Campaign
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: partner-api-campaigns.getCampaign
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: issue-rewards
      description: Issue Rewards
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: partner-api-campaigns.issueRewards
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
