source: >-
  Derived by aligning the live MCP tool list read from https://docs.thanx.com/mcp
  (mcp/thanx-mcp.yml, probed 2026-08-13) with the REST OpenAPI split one-per-tag under
  openapi/ (30 operations; sources archived in openapi/_original/).
purpose: >-
  Bind each MCP tool to the REST operation(s) that back it, so an agent can see which surface
  actually does the work. For Thanx the answer is the interesting one: the two surfaces do NOT
  overlap. Thanx's MCP server is a DOCUMENTATION server — it searches and reads docs.thanx.com —
  while every loyalty capability (users, rewards, points, baskets, campaigns, issuance) is REST
  only. There is no MCP tool that issues a reward, and no REST operation that searches the docs.
  An agent that connects only to the MCP server can read about Thanx but cannot transact with it.
surfaces:
  rest_openapi: openapi/          # 14 tag-split documents, 30 operations; hosts api.thanx.com + loyalty.thanx.com
  mcp: https://docs.thanx.com/mcp # remote, anonymous, tools/list returned 200 with real inputSchemas
  graphql: null                   # Thanx publishes no GraphQL surface
  gated: none                     # neither surface required credentials to enumerate
