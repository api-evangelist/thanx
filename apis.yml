aid: thanx
name: Thanx
description: >-
  Thanx is a customer engagement, loyalty, and marketing automation platform
  for restaurants and other offline businesses, built to acquire, engage, and
  retain best customers and grow customer lifetime value. The platform combines
  data infrastructure, lifecycle marketing, loyalty and CRM, and digital
  ordering experiences. Thanx is API-first and publishes a public developer
  portal documenting a Consumer API for custom consumer experiences, a Partner
  API for privileged integration use cases, and a Loyalty API for digital
  ordering and kiosk providers, along with webhooks and data export
  integrations to warehouses like Snowflake and BigQuery. Thanx serves roughly
  500 brands and processes over a billion transactions annually.
