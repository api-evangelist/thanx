apis:
  - aid: thanx:consumer-api
    name: Thanx Consumer API
    description: >-
      The Thanx Consumer API lets brands integrate Thanx into a custom consumer
      experience, covering users and authentication, cards, gifts, rewards,
      purchases, and points or loyalty balances. It powers branded apps and
      digital experiences built on top of the Thanx loyalty and CRM platform.
    humanURL: https://docs.thanx.com/overview
    tags:
      - Loyalty
      - Rewards
      - Users
      - Gifts
    properties:
      - type: Documentation
        url: https://docs.thanx.com/overview
  - aid: thanx:partner-api
    name: Thanx Partner API
    description: >-
      The Thanx Partner API provides privileged endpoints supporting custom
      integration use cases, including campaign management, subscriber
      handling, and feedback. It is intended for approved partners building
      deeper integrations with the Thanx engagement and marketing platform.
    humanURL: https://docs.thanx.com/overview
    tags:
      - Campaigns
      - Subscribers
      - Marketing
    properties:
      - type: Documentation
        url: https://docs.thanx.com/overview
  - aid: thanx:loyalty-api
    name: Thanx Loyalty API
    description: >-
      The Thanx Loyalty API supports integrations with digital ordering and
      kiosk providers, exposing loyalty and points operations such as balance
      tracking, redemption, and multipliers so external ordering systems can
      connect to a brand's Thanx loyalty program.
    humanURL: https://docs.thanx.com/overview
    tags:
      - Loyalty
      - Points
      - Online Ordering
    properties:
      - type: Documentation
        url: https://docs.thanx.com/overview
