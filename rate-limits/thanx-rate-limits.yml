specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Thanx
providerId: thanx
created: '2026-06-03'
modified: '2026-06-03'
reconciled: false
tags:
  - Rate Limiting
  - Loyalty
  - Guest Engagement
  - Restaurant
description: >-
  Thanx does not publish numeric request-rate or concurrency limits in its
  developer documentation, and the documented error catalog does not include a
  429 / Too Many Requests code. The actionable throughput guidance Thanx does
  publish is batch-oriented: reward issuance via the Partner API should collect
  identifiers and submit them in batches of up to 10,000 per request for optimal
  throughput and to avoid rate limiting. Collection endpoints are paginated.
  Treat the numeric values here as documentation-derived guidance rather than
  contractual limits; confirm production limits with Thanx.
sources:
  - https://docs.thanx.com/partner/campaigns/issue-rewards.md
  - https://docs.thanx.com/consumer/usage/errors.md
  - https://docs.thanx.com/consumer/usage/patterns.md
responseCodes:
  badRequest: 400
  unauthorized: 401
  forbidden: 403
  notFound: 404
limits:
  - name: General request rate
    scope: client
    metric: requests_per_second
    limit: 'not published — confirm with Thanx'
    notes: >-
      No per-second or per-minute request limit is documented. No 429 response
      code is listed in the Consumer API error catalog.
  - name: Reward issuance batch size (Partner API)
    scope: account
    metric: identifiers_per_request
    limit: 10000
    notes: >-
      Submit campaign reward identifiers in batches of up to 10,000 per request
      to the Issue Rewards endpoint for optimal throughput and to avoid rate
      limiting. Issuance is processed asynchronously via an issuance job.
  - name: Partner access token lifetime
    scope: token
    metric: seconds
    limit: 3600
    notes: >-
      Privileged end-user access tokens accept an optional expires_in between
      60 and 3600 seconds.
policies:
  - name: Batch over loop
    description: >-
      Prefer batched reward issuance (up to 10,000 identifiers per request) over
      issuing rewards one at a time; this is the documented mechanism for
      avoiding rate limiting.
  - name: Asynchronous processing
    description: >-
      Reward issuance returns 202 Accepted with an issuance job; poll the
      issuance-job endpoint for completion rather than blocking.
  - name: Pagination
    description: >-
      Collection endpoints (rewards, purchases, locations, campaigns, users)
      return a pagination object (total_page, per_page, current_page); page
      through results instead of requesting large pages.
